<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <div class="card__badge">Pro</div>
      <img class="card__avatar" src="https://i.pravatar.cc/80" alt="Avatar" />
      <div class="card__body">
        <h2 class="card__name">Supreecha J.</h2>
        <p class="card__role">Senior Frontend Dev</p>
        <ul class="card__tags">
          <li>React</li>
          <li>TypeScript</li>
          <li class="card__tags--muted">CSS</li>
        </ul>
      </div>
      <div class="card__actions">
        <a class="btn" href="#">View Profile</a>
        <a class="btn btn--ghost" href="#">Message</a>
      </div>
    </div>
  </body>
</html>
